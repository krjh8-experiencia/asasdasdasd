<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editor de JAR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/themes/default/style.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/jstree.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/java/java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/yaml/yaml.min.js"></script>
    <style>
        body { font-family: Arial; display: flex; }
        #tree { width: 30%; height: 100vh; overflow: auto; }
        #editor-container { width: 70%; height: 100vh; display: flex; flex-direction: column; }
        #editor { flex: 1; }
        #buttons { padding: 10px; }
    </style>
</head>
<body>
    <div id="tree"></div>
    <div id="editor-container">
        <div id="buttons">
            <input type="file" id="upload" accept=".jar">
            <button id="save-btn" disabled>Guardar</button>
            <button id="download-btn" disabled>Descargar JAR Modificado</button>
        </div>
        <div id="editor"></div>
    </div>

    <script>
        let sessionId = null;
        let currentPath = null;
        let editor = null;
        let fileType = null;

        // Initialize CodeMirror
        editor = CodeMirror(document.getElementById('editor'), {
            lineNumbers: true,
            mode: 'text',
            readOnly: true
        });

        // Upload JAR
        document.getElementById('upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            const formData = new FormData();
            formData.append('file', file);
            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();
            sessionId = data.session_id;
            loadTree(data.tree);
            document.getElementById('download-btn').disabled = false;
        });

        // Load tree with jsTree
        function loadTree(treeData) {
            const jstreeData = convertToJsTreeFormat(treeData, '');
            $('#tree').jstree('destroy').empty();
            $('#tree').jstree({
                'core': { 'data': jstreeData },
            }).on('select_node.jstree', async (e, data) => {
                if (data.node.type !== 'file') return;
                currentPath = data.node.id;
                const res = await fetch(`/file/${sessionId}/${currentPath}`);
                const fileData = await res.json();
                fileType = fileData.type;
                editor.setOption('mode', fileType === 'java' ? 'java' : 'yaml');
                editor.setOption('readOnly', !fileData.editable);
                editor.setValue(fileData.content || '');
                document.getElementById('save-btn').disabled = !fileData.editable;
            });
        }

        // Convert dict tree to jsTree format
        function convertToJsTreeFormat(node, path) {
            const result = [];
            for (const key in node) {
                const newPath = path ? `${path}/${key}` : key;
                const child = {
                    text: key,
                    id: newPath,
                    children: convertToJsTreeFormat(node[key], newPath),
                    type: Object.keys(node[key]).length === 0 ? 'file' : 'folder'
                };
                result.push(child);
            }
            return result;
        }

        // Save
        document.getElementById('save-btn').addEventListener('click', async () => {
            if (!currentPath) return;
            const content = editor.getValue();
            const res = await fetch(`/save/${sessionId}/${currentPath}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });
            if (res.ok) alert('Guardado!');
            else alert('Error al guardar');
        });

        // Download
        document.getElementById('download-btn').addEventListener('click', () => {
            if (!sessionId) return;
            window.location.href = `/download/${sessionId}`;
        });
    </script>
</body>
</html>

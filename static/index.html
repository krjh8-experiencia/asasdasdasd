<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JAR Editor DEBUG</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/themes/default/style.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/jstree.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/java/java.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/yaml/yaml.min.js"></script>

<style>
body { margin:0; height:100vh; display:flex; font-family:Arial }
#tree { width:30%; border-right:1px solid #aaa; overflow:auto; padding:10px }
#right { width:70%; display:flex; flex-direction:column }
#editor { flex:1 }
#top { padding:10px; border-bottom:1px solid #aaa }
</style>
</head>

<body>

<div id="tree">Subí un JAR</div>

<div id="right">
    <div id="top">
        <input type="file" id="upload" accept=".jar">
        <span id="status"></span>
    </div>
    <div id="editor"></div>
</div>

<script>
let sessionId = null;

const editor = CodeMirror(document.getElementById("editor"), {
    lineNumbers: true,
    readOnly: true,
    mode: "text"
});

function log(msg) {
    console.log(msg);
    document.getElementById("status").textContent = msg;
}

// convierte árbol backend → jsTree
function build(tree, base="") {
    return Object.entries(tree).map(([name, val]) => {
        const full = base ? base + "/" + name : name;
        return {
            text: name,
            id: full,
            children: val ? build(val, full) : false
        };
    });
}

function loadTree(tree) {
    $("#tree").jstree("destroy");
    $("#tree").jstree({
        core: { data: build(tree) }
    });

    // 🔥 FORZADO: click SIMPLE
    $("#tree").on("click", ".jstree-anchor", async function () {
        const node = $("#tree").jstree(true).get_node(this);
        if (!node || node.children !== false) return;

        const path = node.id;
        log("Cargando: " + path);

        try {
            const res = await fetch(`/file/${sessionId}/${path}`);
            const data = await res.json();

            console.log("RESPUESTA BACKEND:", data);

            editor.setValue(data.content ?? "<<< SIN CONTENT >>>");
            editor.setOption("mode", data.type === "java" ? "text/x-java" : "yaml");
            editor.setOption("readOnly", !data.editable);

            log("OK: " + path);

        } catch (e) {
            editor.setValue("ERROR\n" + e);
            log("ERROR cargando archivo");
        }
    });
}

// subir jar
document.getElementById("upload").addEventListener("change", async e => {
    const f = e.target.files[0];
    if (!f) return;

    log("Subiendo JAR...");

    const fd = new FormData();
    fd.append("file", f);

    const res = await fetch("/upload", { method:"POST", body:fd });
    const data = await res.json();

    sessionId = data.session_id;
    loadTree(data.tree);

    log("JAR cargado");
});
</script>

</body>
</html>

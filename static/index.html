<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JAR Decompiler</title>
<style>
body {
  background:#0f0f0f;
  color:#fff;
  font-family: monospace;
}
button {
  padding:10px;
  background:#00ff88;
  border:none;
  cursor:pointer;
}
pre {
  background:#111;
  padding:10px;
  overflow:auto;
  max-height:300px;
}
</style>
</head>
<body>

<h2>Subir JAR</h2>

<input type="file" id="file" accept=".jar">
<button onclick="upload()">Decompilar</button>

<div id="out"></div>

<script>
async function upload() {
  const f = document.getElementById("file").files[0];
  if (!f) return alert("Subí un .jar");

  const fd = new FormData();
  fd.append("file", f);

  const r = await fetch("/upload", { method:"POST", body:fd });
  const data = await r.json();

  const out = document.getElementById("out");
  out.innerHTML = "";

  for (const file in data) {
    out.innerHTML += `<h4>${file}</h4><pre>${escapeHtml(data[file])}</pre>`;
  }
}

function escapeHtml(text) {
  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}
</script>

</body>
</html>

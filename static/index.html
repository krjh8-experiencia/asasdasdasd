<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JAR Decompiler</title>
<style>
body { font-family: Arial; display:flex; height:100vh; margin:0 }
#left { width:30%; border-right:1px solid #ccc; padding:10px; overflow:auto }
#right { flex:1 }
textarea { width:100%; height:100%; font-family:monospace }
button { padding:10px; margin-bottom:10px }
</style>
</head>
<body>

<div id="left">
  <input type="file" id="upload" accept=".jar"><br><br>
  <ul id="files"></ul>
</div>

<div id="right">
  <textarea id="editor" readonly></textarea>
</div>

<script>
let files = []

document.getElementById("upload").onchange = async e => {
  const fd = new FormData()
  fd.append("file", e.target.files[0])

  const res = await fetch("/upload", { method:"POST", body:fd })
  const data = await res.json()

  files = data.files
  const ul = document.getElementById("files")
  ul.innerHTML = ""

  files.forEach(f => {
    const li = document.createElement("li")
    li.textContent = f
    li.style.cursor = "pointer"
    li.onclick = () => loadFile(f)
    ul.appendChild(li)
  })
}

async function loadFile(name) {
  const res = await fetch("/file/" + encodeURIComponent(name))
  const data = await res.json()
  document.getElementById("editor").value = data.content
}
</script>

</body>
</html>

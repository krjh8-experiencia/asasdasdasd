<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Decompiler Editor</title>
<style>
body { display:flex; height:100vh; margin:0; font-family: monospace }
#tree { width:30%; border-right:1px solid #ccc; overflow:auto; padding:10px }
#editor { flex:1; display:flex; flex-direction:column }
textarea { flex:1; width:100%; font-family: monospace }
button { padding:10px }
.file { cursor:pointer }
.bin { color:#999 }
</style>
</head>
<body>

<div id="tree">
<input type="file" id="file">
<button onclick="upload()">Subir</button>
<div id="files"></div>
</div>

<div id="editor">
<div id="path"></div>
<textarea id="content"></textarea>
<button onclick="save()">Guardar</button>
<button onclick="download()">Descargar JAR</button>
</div>

<script>
let SID = null;
let CURRENT = null;

function upload(){
  const f = document.getElementById("file").files[0];
  const fd = new FormData();
  fd.append("file", f);

  fetch("/upload",{method:"POST",body:fd})
  .then(r=>r.json()).then(j=>{
    SID=j.session;
    loadTree();
  });
}

function loadTree(){
 fetch(`/tree/${SID}`).then(r=>r.json()).then(list=>{
  const div=document.getElementById("files");
  div.innerHTML="";
  list.forEach(i=>{
    if(i.type==="file"){
      const d=document.createElement("div");
      d.textContent=i.path;
      d.className="file "+(i.editable?"":"bin");
      if(i.editable) d.onclick=()=>openFile(i.path);
      div.appendChild(d);
    }
  });
 });
}

function openFile(p){
 CURRENT=p;
 document.getElementById("path").textContent=p;
 fetch(`/read/${SID}?path=${encodeURIComponent(p)}`)
 .then(r=>r.json()).then(j=>{
  document.getElementById("content").value=j.content||"";
 });
}

function save(){
 fetch(`/save/${SID}?path=${encodeURIComponent(CURRENT)}`,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({content:document.getElementById("content").value})
 });
}

function download(){
 window.location=`/download/${SID}`;
}
</script>

</body>
</html>

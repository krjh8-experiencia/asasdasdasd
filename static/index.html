<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JAR Viewer / Decompiler</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/themes/default/style.min.css">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/jstree.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/java/java.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/yaml/yaml.min.js"></script>

<style>
body {
    margin: 0;
    display: flex;
    height: 100vh;
    font-family: Arial;
}
#tree {
    width: 30%;
    border-right: 1px solid #ccc;
    overflow: auto;
    padding: 10px;
}
#editor {
    width: 70%;
    height: 100vh;
}
</style>
</head>

<body>

<div id="tree"></div>
<textarea id="editor"></textarea>

<script>
let sessionId = null;

const editor = CodeMirror.fromTextArea(
    document.getElementById("editor"),
    {
        lineNumbers: true,
        readOnly: true,
        mode: "text"
    }
);

// =========================
// SUBIR JAR
// =========================
const input = document.createElement("input");
input.type = "file";
input.accept = ".jar";
input.style.display = "none";
document.body.appendChild(input);

document.body.addEventListener("dblclick", () => input.click());

input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;

    const fd = new FormData();
    fd.append("file", file);

    const res = await fetch("/upload", { method: "POST", body: fd });
    const data = await res.json();

    sessionId = data.session_id;
    loadTree(data.tree);
};

// =========================
// ARBOL
// =========================
function toJsTree(obj, base = "") {
    return Object.entries(obj).map(([name, val]) => {
        const full = base ? base + "/" + name : name;
        return {
            text: name,
            id: full,
            children: val ? toJsTree(val, full) : false,
            icon: val ? "jstree-folder" : "jstree-file"
        };
    });
}

function loadTree(tree) {
    $("#tree").jstree("destroy").jstree({
        core: { data: toJsTree(tree) }
    }).on("select_node.jstree", async (e, d) => {

        if (d.node.children !== false) return;

        const res = await fetch(
            `/file/${sessionId}/${encodeURIComponent(d.node.id)}`
        );
        const data = await res.json();

        editor.setValue(data.content || "");
        editor.setOption("readOnly", !data.editable);

        if (data.type === "java") {
            editor.setOption("mode", "text/x-java");
        } else if (data.type === "yaml") {
            editor.setOption("mode", "yaml");
        } else {
            editor.setOption("mode", "text");
        }
    });
}
</script>

</body>
</html>

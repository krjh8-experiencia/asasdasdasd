<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JAR Viewer SIMPLE</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/java/java.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/yaml/yaml.min.js"></script>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    font-family: Arial, sans-serif;
}
#files {
    width: 30%;
    border-right: 2px solid #ccc;
    overflow: auto;
    padding: 10px;
}
#files ul {
    list-style: none;
    padding-left: 15px;
}
#files li {
    cursor: pointer;
    padding: 2px 0;
}
#files li:hover {
    background: #eee;
}
#right {
    width: 70%;
    display: flex;
    flex-direction: column;
}
#top {
    padding: 10px;
    border-bottom: 2px solid #ccc;
}
#editor {
    flex: 1;
}
</style>
</head>

<body>

<div id="files">
    <input type="file" id="upload" accept=".jar">
    <div id="tree"></div>
</div>

<div id="right">
    <div id="top"><b id="current">Ningún archivo abierto</b></div>
    <div id="editor"></div>
</div>

<script>
let sessionId = null;

const editor = CodeMirror(document.getElementById("editor"), {
    lineNumbers: true,
    readOnly: true,
    mode: "text"
});

function renderTree(tree, base = "") {
    const ul = document.createElement("ul");

    for (const name in tree) {
        const li = document.createElement("li");
        const fullPath = base ? base + "/" + name : name;

        li.textContent = name;

        if (tree[name] === null) {
            // ARCHIVO
            li.onclick = async () => {
                console.log("CLICK:", fullPath);
                document.getElementById("current").textContent = fullPath;

                const res = await fetch(`/file/${sessionId}/${fullPath}`);
                const data = await res.json();

                console.log("RESPUESTA:", data);

                editor.setValue(data.content || "<<< VACÍO >>>");
                editor.setOption(
                    "mode",
                    data.type === "java" ? "text/x-java" : "yaml"
                );
                editor.setOption("readOnly", !data.editable);
            };
        } else {
            // CARPETA
            li.style.fontWeight = "bold";
            li.appendChild(renderTree(tree[name], fullPath));
        }

        ul.appendChild(li);
    }

    return ul;
}

document.getElementById("upload").addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) return;

    const fd = new FormData();
    fd.append("file", file);

    const res = await fetch("/upload", { method: "POST", body: fd });
    const data = await res.json();

    sessionId = data.session_id;

    const treeDiv = document.getElementById("tree");
    treeDiv.innerHTML = "";
    treeDiv.appendChild(renderTree(data.tree));
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JAR Viewer</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/themes/default/style.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/jstree.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/java/java.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/yaml/yaml.min.js"></script>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    font-family: Arial, sans-serif;
}

/* Árbol */
#tree {
    width: 30%;
    border-right: 2px solid #ccc;
    overflow: auto;
    padding: 10px;
    background: #fafafa;
}

/* Zona de código */
#code-zone {
    width: 70%;
    display: flex;
    flex-direction: column;
}

#top-bar {
    padding: 10px;
    border-bottom: 2px solid #ccc;
    background: #f0f0f0;
}

#file-name {
    font-weight: bold;
}

#editor {
    flex: 1;
}
</style>
</head>

<body>

<!-- PANEL IZQUIERDO -->
<div id="tree">
    <p><b>Subí un archivo .jar</b></p>
</div>

<!-- PANEL DERECHO -->
<div id="code-zone">
    <div id="top-bar">
        <input type="file" id="upload" accept=".jar">
        <span id="file-name">Ningún archivo abierto</span>
    </div>
    <div id="editor"></div>
</div>

<script>
let sessionId = null;

// Editor FIJO (zona propia)
const editor = CodeMirror(document.getElementById("editor"), {
    lineNumbers: true,
    readOnly: true,
    mode: "text"
});

// Convierte árbol backend a jsTree
function toJsTree(tree, base = "") {
    return Object.entries(tree).map(([name, value]) => {
        const fullPath = base ? base + "/" + name : name;
        return {
            text: name,
            id: fullPath,
            children: value ? toJsTree(value, fullPath) : false
        };
    });
}

// Cargar árbol
function loadTree(tree) {
    $("#tree").jstree("destroy");

    $("#tree").jstree({
        core: { data: toJsTree(tree) }
    });

    // 🔥 EVENTO SIMPLE, SIN BUGS
    $("#tree").on("click", ".jstree-anchor", async function () {
        const instance = $("#tree").jstree(true);
        const node = instance.get_node(this);

        if (!node || node.children !== false) return;

        document.getElementById("file-name").textContent = node.id;

        try {
            const res = await fetch(`/file/${sessionId}/${node.id}`);
            const data = await res.json();

            // FORZAR escritura en el panel
            if (!data || data.content === undefined) {
                editor.setValue("❌ El servidor no devolvió contenido");
                return;
            }

            editor.setValue(
                data.content === ""
                ? "⚠️ Archivo vacío o no legible"
                : data.content
            );

            editor.setOption(
                "mode",
                data.type === "java" ? "text/x-java" : "yaml"
            );
            editor.setOption("readOnly", !data.editable);

        } catch (e) {
            editor.setValue("❌ ERROR cargando archivo\n" + e);
        }
    });
}

// Subir JAR
document.getElementById("upload").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    editor.setValue("Cargando JAR...");
    document.getElementById("file-name").textContent = "";

    const form = new FormData();
    form.append("file", file);

    const res = await fetch("/upload", {
        method: "POST",
        body: form
    });

    const data = await res.json();
    sessionId = data.session_id;

    loadTree(data.tree);
});
</script>

</body>
</html>
